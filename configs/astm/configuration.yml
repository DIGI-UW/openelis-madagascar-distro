# OpenELIS Analyzer Bridge Configuration
# Reference: https://github.com/DIGI-UW/openelis-analyzer-bridge
#
# Only the keys the bridge actually binds are set here: bridge.* and
# org.itech.ahb.*. Everything else is supplied by docker-compose.yml as
# environment variables, which take precedence over this file.

org:
  itech:
    ahb:
      forward-http-server:
        # The bridge appends /fhir and POSTs the normalized result contract.
        #
        # healthUri must stay on the same host as uri. A health check that probes a
        # different host reports healthy while every delivery fails, which is how an
        # outage went unnoticed in Madagascar. docker-compose.yml sets both from one
        # pair of environment variables for that reason; these are only the fallbacks.
        uri: https://openelisglobal-webapp:8443/OpenELIS-Global/analyzer
        healthUri: https://openelisglobal-webapp:8443/OpenELIS-Global/health
        healthMethod: GET
        username: admin
        password: adminADMIN!

management:
  health:
    httpforward:
      enabled: true
    # Reports the delivery queue: UP while results are queued, since riding out an
    # OpenELIS outage is what the outbox is for, and DOWN only when the store cannot
    # be read or had to be replaced.
    outbox:
      enabled: true

logging:
  level:
    # INFO, not DEBUG or TRACE: the vendored ASTM library logs whole clinical
    # messages at TRACE, and DEBUG is noisy enough to bury delivery failures.
    org.itech: INFO

# =============================================================================
# Analyzer-Specific RS232 Serial Configuration Reference
# =============================================================================
# Bridge stores runtime settings in its saved, profile-pinned connections.
# OpenELIS manages the lab-facing reference and workflow. The settings below
# are a connection reference, not a separate runtime configuration source.
#
# For serial-to-TCP converters (e.g. Moxa, Lantronix), configure the converter
# to match these RS232 parameters, then configure this bridge for TCP.
# =============================================================================

# Mindray BA-88A Semi-automatic Biochemistry Analyzer
# Protocol: ASTM LIS2-A2 over RS232
# mindray-ba88a:
#   serial:
#     port: /dev/ttyUSB0       # Linux serial port (or COM1 on Windows)
#     baud_rate: 9600          # Standard baud rate for BA-88A
#     data_bits: 8             # 8 data bits
#     stop_bits: 1             # 1 stop bit
#     parity: NONE             # No parity
#     flow_control: NONE       # No hardware/software flow control
#   tests:
#     - ALT                    # Alanine Aminotransferase
#     - AST                    # Aspartate Aminotransferase
#     - ALP                    # Alkaline Phosphatase
#     - T-Bil                  # Total Bilirubin
#     - D-Bil                  # Direct Bilirubin
#     - TC                     # Total Cholesterol
#     - TG                     # Triglycerides
#     - HDL-C                  # HDL Cholesterol
#     - CREA                   # Creatinine
#     - TP                     # Total Protein
